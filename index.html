<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatório Geral de Obras</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
        }

        header {
            text-align: center;
            padding: 20px;
        }

        header img {
            max-width: 150px;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        section {
            padding: 20px;
            border-bottom: 1px solid #333;
        }

        .obra-card {
            background-color: #111;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        .obra-card h2 {
            margin: 0 0 10px 0;
            font-size: 20px;
        }

        .obra-stats {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }

        .stat {
            margin: 5px 0;
            text-align: center;
        }

        .stat span {
            display: block;
            font-size: 18px;
            font-weight: bold;

            .obra-plan {
                margin-top: 10px;
                padding-top: 10px;
                border-top: 1px solid #333;
            }

            .obra-plan h3 {
                margin: 0 0 10px 0;
                font-size: 18px;
            }
        }

        @media (max-width: 600px) {
            .obra-stats {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>

<body>

    <header>
        <img src="logo.png" alt="Logo da Empresa">
        <h1>Relatório Geral de Obras</h1>
    </header>

    <section>
        <h2>RDO e Cronograma</h2>

        <div class="obra-card">
            <h2>Obra 1 - 29/04/2026</h2>
            <div class="obra-stats">
                <div class="stat">Total Pessoas<span>50</span></div>
                <div class="stat">Presentes<span>45</span></div>
                <div class="stat">Faltas<span>3</span></div>
                <div class="stat">Atestados<span>2</span></div>
            </div>

            <div class="obra-plan">
                <h3>Planejamento</h3>
                <div class="obra-stats">
                    <div class="stat">% Planejada<span>80%</span></div>
                    <div class="stat">% Realizada<span>75%</span></div>
                    <div class="stat">Desvio<span>-5%</span></div>
                </div>
            </div>
        </div>

        <div class="obra-card">
            <h2>Obra 2 - 27/04/2026</h2>
            <div class="obra-stats">
                <div class="stat">Total Pessoas<span>30</span></div>
                <div class="stat">Presentes<span>28</span></div>
                <div class="stat">Faltas<span>1</span></div>
                <div class="stat">Atestados<span>1</span></div>
            </div>

            <div class="obra-plan">
                <h3>Planejamento</h3>
                <div class="obra-stats">
                    <div class="stat">% Planejada<span>60%</span></div>
                    <div class="stat">% Realizada<span>65%</span></div>
                    <div class="stat">Desvio<span>+5%</span></div>
                </div>
            </div>
        </div>

        <!-- Repita para outras obras -->
    </section>

</body>

</html>
